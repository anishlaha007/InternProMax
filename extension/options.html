<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>InternProMax options</title>
  <style>
    :root { color-scheme: light dark; }
    body { font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; }
    label { display: block; font-weight: 600; margin: 16px 0 6px; }
    input { width: 100%; box-sizing: border-box; height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid #cfcec7; font: inherit; }
    button { margin-top: 14px; height: 34px; padding: 0 14px; border-radius: 8px; border: 0; background: #2a63d6; color: #fff; font: 600 13.5px system-ui, sans-serif; cursor: pointer; }
    .muted { color: #6b6a72; font-size: 13px; }
    .hint { color: #6b6a72; font-size: 12.5px; font-weight: 400; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>InternProMax</h1>
  <p class="muted">Where is your InternProMax running? On this computer it's <code>http://127.0.0.1:8420</code>. On a server, use the address from your setup (for example your Tailscale name, like <code>http://ipm-server:8420</code>).</p>
  <form id="form">
    <label for="api">Server address</label>
    <input id="api" type="url" placeholder="http://127.0.0.1:8420" required>
    <label for="pw">Password <span class="hint">(only for a server; leave empty on this computer)</span></label>
    <input id="pw" type="password" autocomplete="current-password">
    <button id="save" type="submit">Connect</button>
  </form>
  <p id="status" class="muted" role="status"></p>
  <script src="options.js"></script>
</body>
</html>
