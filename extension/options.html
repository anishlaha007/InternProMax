<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>InternProMax options</title>
  <style>
    :root { color-scheme: light dark; }
    body { font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; }
    label { display: block; font-weight: 600; margin: 16px 0 6px; }
    input { width: 100%; box-sizing: border-box; height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid #cfcec7; font: inherit; }
    button { margin-top: 10px; height: 34px; padding: 0 14px; border-radius: 8px; border: 0; background: #2a63d6; color: #fff; font: 600 13.5px system-ui, sans-serif; cursor: pointer; }
    .muted { color: #6b6a72; font-size: 13px; }
  </style>
</head>
<body>
  <h1>InternProMax</h1>
  <p class="muted">The extension talks only to your local InternProMax server. It learns the address automatically when you open the dashboard; set it here if you changed the port.</p>
  <label for="api">Server address</label>
  <input id="api" type="url" placeholder="http://127.0.0.1:8420">
  <button id="save" type="button">Save &amp; test</button>
  <p id="status" class="muted" role="status"></p>
  <script src="options.js"></script>
</body>
</html>
