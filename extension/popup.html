<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>InternProMax</title>
  <style>
    :root { color-scheme: light dark; --bg: #fff; --fg: #17171b; --muted: #5b5a63; --line: #e3e2dc; --soft: #f6f6f3; --accent: #2a63d6; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1b1b1e; --fg: #f1f1f3; --muted: #b9b8c0; --line: #2e2e33; --soft: #232327; --accent: #4d86ee; } }
    body { margin: 0; width: 300px; font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: var(--fg); }
    header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); font-weight: 700; }
    header img { width: 20px; height: 20px; }
    main { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
    .muted { color: var(--muted); }
    .box { background: var(--soft); border-radius: 9px; padding: 9px 11px; }
    .row { display: flex; gap: 6px; flex-wrap: wrap; }
    button { font: 600 12.5px system-ui, sans-serif; height: 30px; padding: 0 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <header><img src="icons/icon32.png" alt="">InternProMax</header>
  <main id="main"><div class="muted">Loading…</div></main>
  <script src="popup.js"></script>
</body>
</html>
