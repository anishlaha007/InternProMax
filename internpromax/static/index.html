<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InternProMax</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="#/jobs">
        <img src="icon.svg" alt="" width="26" height="26">
        <span>InternProMax</span>
      </a>
      <nav class="nav" id="nav">
        <a href="#/jobs" data-route="jobs"><span class="nav-ico" aria-hidden="true">◎</span>Jobs<span class="nav-count" id="nav-jobs"></span></a>
        <a href="#/tracker" data-route="tracker"><span class="nav-ico" aria-hidden="true">▦</span>Tracker<span class="nav-count" id="nav-tracker"></span></a>
        <a href="#/inbox" data-route="inbox"><span class="nav-ico" aria-hidden="true">✉</span>Inbox<span class="nav-count" id="nav-inbox"></span></a>
        <a href="#/profile" data-route="profile"><span class="nav-ico" aria-hidden="true">☺</span>Profile<span class="nav-count warn" id="nav-profile"></span></a>
        <a href="#/settings" data-route="settings"><span class="nav-ico" aria-hidden="true">⚙</span>Settings</a>
      </nav>
      <div class="sidebar-foot">
        <div id="sync-status" class="muted small"></div>
        <button class="btn btn-ghost btn-sm" id="sync-btn" type="button">Sync listings</button>
        <div id="ext-status" class="small"></div>
      </div>
    </aside>
    <main id="main" tabindex="-1"></main>
  </div>
  <div id="drawer-root"></div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
