<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Apply | Initrode Aerospace Careers</title></head>
<body>
  <main>
    <h2>Your application</h2>
    <form action="/confirmation.html" method="get">
      <p><label for="fn">First name</label> <input id="fn" name="fn" type="text" required></p>
      <p><label for="ln">Last name</label> <input id="ln" name="ln" type="text" required></p>
      <p><label for="em">Email address</label> <input id="em" name="em" type="email" required></p>
      <p><label for="ph">Phone number</label> <input id="ph" name="ph" type="tel"></p>
      <p><label for="cv">Upload your resume</label> <input id="cv" name="cv" type="file" required></p>
      <p><label for="auth">Are you legally authorized to work in the U.S.?</label>
        <select id="auth" name="auth"><option value="">Select</option><option>Yes</option><option>No</option></select></p>
      <button type="submit">Submit application</button>
    </form>
  </main>
</body>
</html>
