<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Globex - Data Engineering Intern</title></head>
<body>
<div class="content">
  <div class="posting-headline"><h2>Data Engineering Intern</h2></div>
  <form id="app" class="application-form">
    <h4>Submit your application</h4>
    <ul>
      <li class="application-question"><label><div class="application-label">Resume/CV ✱</div>
        <div class="application-field"><input type="file" name="resume" id="resume-upload-input"></div></label></li>
      <li class="application-question"><label><div class="application-label">Full name ✱</div>
        <div class="application-field"><input type="text" name="name" required></div></label></li>
      <li class="application-question"><label><div class="application-label">Email ✱</div>
        <div class="application-field"><input type="email" name="email" required></div></label></li>
      <li class="application-question"><label><div class="application-label">Phone</div>
        <div class="application-field"><input type="text" name="phone"></div></label></li>
      <li class="application-question"><label><div class="application-label">Current company</div>
        <div class="application-field"><input type="text" name="org"></div></label></li>
      <li class="application-question"><label><div class="application-label">LinkedIn URL</div>
        <div class="application-field"><input type="text" name="urls[LinkedIn]"></div></label></li>
      <li class="application-question"><label><div class="application-label">GitHub URL</div>
        <div class="application-field"><input type="text" name="urls[GitHub]"></div></label></li>
      <li class="application-question">
        <div class="application-label">Are you 18 years of age or older? ✱</div>
        <div class="application-field">
          <label><input type="radio" name="cards[a][field0]" value="Yes"> Yes</label>
          <label><input type="radio" name="cards[a][field0]" value="No"> No</label>
        </div></li>
      <li class="application-question">
        <div class="application-label">Why are you interested in this role?</div>
        <div class="application-field"><textarea name="cards[a][field1]"></textarea></div></li>
    </ul>
    <button type="submit" class="template-btn-submit">Submit application</button>
  </form>
  <div id="done" hidden><h3>Application submitted!</h3><p>Thanks for applying to Globex.</p></div>
</div>
<script>
  document.getElementById('app').addEventListener('submit', (e) => {
    e.preventDefault();
    setTimeout(() => {
      document.getElementById('app').remove();
      document.getElementById('done').hidden = false;
      history.pushState({}, '', location.pathname + '/thanks');
    }, 400);
  });
</script>
</body>
</html>
