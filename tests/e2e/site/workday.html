<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Initech Careers</title></head>
<body>
<div id="wd">
  <h2>My Information</h2>
  <div data-automation-id="formField-legalNameSection_firstName">
    <label for="input-1">First Name*</label>
    <input id="input-1" type="text" data-automation-id="legalNameSection_firstName">
  </div>
  <div data-automation-id="formField-legalNameSection_lastName">
    <label for="input-2">Last Name*</label>
    <input id="input-2" type="text" data-automation-id="legalNameSection_lastName">
  </div>
  <div><label for="input-3">Email Address*</label><input id="input-3" type="text" data-automation-id="email"></div>
  <div><label for="input-4">Phone Number*</label><input id="input-4" type="text" data-automation-id="phone-number"></div>
  <div><label for="input-5">City*</label><input id="input-5" type="text" data-automation-id="addressSection_city"></div>
  <div><label for="input-6">Postal Code*</label><input id="input-6" type="text" data-automation-id="addressSection_postalCode"></div>
  <div data-automation-id="formField-countryDropdown">
    <label id="country-label">Country*</label>
    <button type="button" id="country" aria-haspopup="listbox" aria-labelledby="country-label" data-automation-id="countryDropdown">Select One</button>
    <ul role="listbox" id="country-list" hidden>
      <li role="option">Canada</li><li role="option">Mexico</li><li role="option">United States of America</li>
    </ul>
  </div>
  <fieldset>
    <legend>Are you legally authorized to work in the country in which the job is located?*</legend>
    <label><input type="radio" name="auth" value="yes"> Yes</label>
    <label><input type="radio" name="auth" value="no"> No</label>
  </fieldset>
  <div><label for="file">Upload a file (resume)</label><input id="file" type="file" data-automation-id="file-upload-input-ref"></div>
  <button type="button" data-automation-id="bottom-navigation-next-button" id="submit">Submit</button>
  <div id="done" hidden data-automation-id="congratulationsPopup"><h2>Application Submitted</h2><p>Congratulations! You have successfully applied.</p></div>
</div>
<script>
  const btn = document.getElementById('country');
  const list = document.getElementById('country-list');
  btn.addEventListener('click', () => { list.hidden = !list.hidden; });
  list.addEventListener('click', (e) => {
    const opt = e.target.closest('[role=option]');
    if (!opt) return;
    btn.textContent = opt.textContent;
    btn.dataset.value = opt.textContent;
    list.hidden = true;
  });
  document.getElementById('submit').addEventListener('click', () => {
    setTimeout(() => { document.getElementById('done').hidden = false; }, 300);
  });
</script>
</body>
</html>
